services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: contentpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: contentpress_db
    volumes:
      - ./src/backend/wp-content:/var/www/html/wp-content
    depends_on:
      - db

  nextjs:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Now Next.js communicates directly with the WordPress container over the internal Docker network!
      - NEXT_PUBLIC_WORDPRESS_API_URL=http://wordpress:80/graphql
    depends_on:
      - wordpress

volumes:
  db_data:
    name: contentpress-backend_db_data
    external: true
